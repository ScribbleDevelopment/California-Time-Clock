<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupertino Clock (Synced)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e1b4b, #09090b);
            color: #f8fafc;
        }
        .clock-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 340px;
        }
        h1 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .time {
            font-size: 2.2rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .date {
            font-size: 1rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .tz {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 8px;
        }
        .status {
            font-size: 0.75rem;
            color: #10b981;
        }
    </style>
</head>
<body>

    <div class="clock-card">
        <h1>Cupertino, CA</h1>
        <div id="time" class="time">Syncing...</div>
        <div id="date" class="date">Fetching internet time...</div>
        <div id="tz" class="tz">Time Zone: America/Los_Angeles</div>
        <div id="status" class="status">Connecting to server...</div>
    </div>

    <script>
        let serverTimeOffset = 0;

        async function fetchInternetTime() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/timezone/America/Los_Angeles');
                const data = await response.json();
                
                const serverTime = new Date(data.datetime).getTime();
                const localTime = Date.now();
                
                // Calculate the difference between the internet time and your device time
                serverTimeOffset = serverTime - localTime;
                
                document.getElementById('status').textContent = 'Synced with internet time';
            } catch (error) {
                document.getElementById('status').textContent = 'Using estimated sync';
                document.getElementById('status').style.color = '#f59e0b';
            }
        }

        function updateClock() {
            // Apply the internet time offset so it's accurate regardless of your iPad
            const now = new Date(Date.now() + serverTimeOffset);
            
            const timeOptions = {
                timeZone: 'America/Los_Angeles',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            
            const dateOptions = {
                timeZone: 'America/Los_Angeles',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };

            const timeString = new Intl.DateTimeFormat('en-US', timeOptions).format(now);
            const dateString = new Intl.DateTimeFormat('en-US', dateOptions).format(now);

            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
        }

        // Fetch time immediately, then re-sync every 10 minutes
        fetchInternetTime();
        setInterval(fetchInternetTime, 10 * 60 * 1000);

        // Update the visual clock every second using the synced time
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>

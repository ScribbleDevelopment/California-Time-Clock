<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>California Time Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e1b4b, #09090b);
            color: #f8fafc;
        }
        .clock-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }
        h1 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .time {
            font-size: 2.2rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .date {
            font-size: 1rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .tz {
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="clock-card">
        <h1>Cupertino, CA (PST/PDT)</h1>
        <div id="time" class="time">00:00:00</div>
        <div id="date" class="date">Loading...</div>
        <div id="tz" class="tz">Loading...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            const timeOptions = {
                timeZone: 'America/Los_Angeles',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            
            const dateOptions = {
                timeZone: 'America/Los_Angeles',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            
            const tzOptions = {
                timeZone: 'America/Los_Angeles',
                timeZoneName: 'short'
            };

            const timeString = new Intl.DateTimeFormat('en-US', timeOptions).format(now);
            const dateString = new Intl.DateTimeFormat('en-US', dateOptions).format(now);
            
            const parts = new Intl.DateTimeFormat('en-US', tzOptions).formatToParts(now);
            const tzName = parts.find(p => p.type === 'timeZoneName')?.value || 'PT';

            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
            document.getElementById('tz').textContent = `Time Zone: ${tzName}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
